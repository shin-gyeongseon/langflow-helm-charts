apiVersion: v1
kind: Namespace
metadata:
  name: langflow-test
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-postgres-secret
  namespace: langflow-test
type: Opaque
stringData:
  POSTGRES_DB: langflow
  POSTGRES_USER: langflow
  POSTGRES_PASSWORD: langflow
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-postgres-pvc
  namespace: langflow-test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow-postgres
  namespace: langflow-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow-postgres
  template:
    metadata:
      labels:
        app: langflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: langflow-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langflow-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-postgres
  namespace: langflow-test
spec:
  type: ClusterIP
  selector:
    app: langflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
